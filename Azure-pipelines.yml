trigger:
- main

pool:
  name: Default

steps:
- checkout: self

- powershell: |
    Write-Host "Starting SQL deployment..."

    sqlcmd `
      -S localhost `
      -d CICD_Dev `
      -E `
      -b `
      -i "$(Build.SourcesDirectory)\Deployments\001_AddCustomerContactColumns.sql"

    if ($LASTEXITCODE -ne 0) {
        throw "SQL deployment failed."
    }

    Write-Host "SQL deployment completed successfully."

  displayName: 'Deploy Customer Contact Columns'
